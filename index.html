<html>
    <head>
        <meta charset="UTF-8">
        <!-- title of amazon -->
        <title>Amazon.com。让你花费更少，消费更开心。</title>
        <!-- link to the css file -->
        <link rel="stylesheet" href="css/style.css">
        <!-- change the icon of the website -->
        <link rel="icon" href="img/icon.png">
    </head>
    <body>
        <!-- heading of the website -->
        <div class="heading_top">
            <div class="top_content">
                <!-- left side about the logo -->
                <div class="content_left">
                    <a href="#" class="logo">
                        <img src="img/icon.png" alt="amazon icon" class="amazon_icon">
                    </a>
                </div>

                <!-- deliver place -->
                <div class="heading_deliver">
                    <span class="deliver_linel">交货到</span>
                    <span class="deliver_line2">香港</span>
                </div>

                <!-- searching box on the heading -->
                <div class="search_box">
                    <!-- type of the searching -->
                    <select class="search_type">
                        <option>全部</option>
                        <option>内部商店</option>
                        <option>广告影片</option>
                        <option>健康个啥</option>
                        <option>优惠0元</option>
                        <option>我是时尚</option>
                        <option>音乐你懂啥</option>
                        <option>炸厨房</option>
                        <option>XX启动！</option>
                        <option>打游戏去steam</option>
                        <option>氪金游戏</option>
                        <option>Never</option>
                        <option>gonna</option>
                        <option>give</option>
                        <option>you</option>
                        <option>up</option>
                        <option>神秘皮鞋男</option>
                    </select>
                    <!-- searching part -->
                    <input type="text" class="search_input" placeholder="搜寻 Amazon">
                    <button class="search_btn">🔍</button>
                </div>

                <!-- can choose the lanuage here -->
                <div class="lanuage_box">
                    <!-- type of the lanuage -->
                    <select class="lanuage_type">
                        <option>ZH</option>
                        <option>EN</option>
                        <option>ES</option>
                        <option>AR</option>
                        <option>DE</option>
                        <option>HE</option>
                        <option>KO</option>
                        <option>PT</option>
                        <option>ZH</option>
                        <option>ZH</option>
                    </select>
                </div>
                
                <!-- right side of the heading -->
                <div class="content_right">
                    <a href="#" class="content_item">
                        <span class="item1">您好，登入</span>
                        <span class="item2">账户与清单</span>
                    </a>
                    <a href="#" class="content_item">
                        <span class="item1">退货</span>
                        <span class="item2">与订单</span>
                    </a>
                    <a href="#" class="content_item">购物车</a>
                </div>
            </div>
         </div>
        <!-- subtitle part -->
        <div class="subtitle">
            <div class="subtitle_content">
                <!-- all kind of the subtitle -->
                <a href="#" class="sub_link">全部</a>
                <a href="#" class="sub_link">Amazon Bazaar</a>
                <a href="#" class="sub_link">Prime Video</a>
                <a href="#" class="sub_link">优惠券</a>
                <a href="#" class="sub_link">客户服务部</a>
                <a href="#" class="sub_link">今日优惠</a>
                <a href="#" class="sub_link">礼品单</a>
                <a href="#" class="sub_link">礼品卡</a>
                <a href="#" class="sub_link">我要开店</a>
            </div>
        </div>
        <div class="promo">
            <div class="promo_content">
                <!-- content of the promote -->
                <div class="content_card card_toy">
                    <h3 class="card_title">仮面ライダー玩具</h3>
                    <p class="card_subtitle">选购完整系列</p>
                    <img src="img/card1.png" class="card_img">
                </div>
                <div class="content_card card_deliver">
                    <h3 class="card_title">免费配送才怪</h3>
                    <p class="card_subtitle">每1g收100运费</p>
                    <img src="img/card2.png" class="card_img">
                </div>
                <div class="content_card card_zzz">
                    <h3 class="card_title">最帅形态来了⚡</h3>
                    <p class="card_subtitle">听说这里有梦魇？</p>
                    <img src="img/card3.png" class="card_img">
                </div>
                <div class="content_card card_w">
                    <h3 class="card_title">cyclone joker⚡</h3>
                    <p class="card_subtitle">来细数你的罪恶吧</p>
                    <img src="img/card4.png" class="card_img">
                </div>
            </div>
        </div>
        <!-- add the column of the kind of the product -->
        <div class="section">
            <div class="section_content">
                <!-- column1 -->
                <div class="big_column">
                    <h3 class="big_title">电子产品</h3>
                    <div class="small_column">
                        <!-- four type of this kind of the section -->
                        <div class="small_item">
                            <img src="img/phone.png" class="small_img">
                            <p class="small_text">手机</p>
                        </div>
                        <div class="small_item">
                            <img src="img/headphone.png" class="small_img">
                            <p class="small_text">耳机</p>
                        </div>
                        <div class="small_item">
                            <img src="img/ps5.png" class="small_img">
                            <p class="small_text">打游戏去咯</p>
                        </div>
                        <div class="small_item">
                            <img src="img/pc.png" class="small_img">
                            <p class="small_text">上号！猛攻！</p>
                        </div>
                    </div>
                </div>
                
                <!-- column2 -->
                <div class="big_column">
                    <h3 class="big_title">菜就多练</h3>
                    <div class="small_column">
                        <div class="small_item">
                            <img src="img/mouse.png" class="small_img">
                            <p class="small_text">滑鼠</p>
                        </div>
                        <div class="small_item">
                            <img src="img/sparxie.png" class="small_img">
                            <p class="small_text">滑鼠垫</p>
                        </div>
                        <div class="small_item">
                            <img src="img/aili.png" class="small_img">
                            <p class="small_text">手柄</p>
                        </div>
                        <div class="small_item">
                            <img src="img/charger.png" class="small_img">
                            <p class="small_text">充电宝</p>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </body>
</html>
